# CI pipeline (section 12): contracts first, then Go + the 4 Java modules in parallel.
# The "images" and "e2e" jobs are added in W12 once the Dockerfiles exist (M1).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  contracts:
    name: contracts (buf lint + breaking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          breaking: ${{ github.event_name == 'pull_request' }}
          breaking_against: ${{ github.event.repository.clone_url }}#branch=main
          push: false

  events:
    name: contracts (event examples vs JSON Schemas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema
      - run: python .github/scripts/validate_events.py

  go:
    name: go (aegis-probe)
    needs: contracts
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegis-probe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: aegis-probe/go.mod
      - run: go vet ./...
      - run: go test -race -cover ./...

  java:
    name: java (${{ matrix.module }})
    needs: contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [telemetry-service, shield-service, shield-engine, commander-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -pl ${{ matrix.module }} -am verify
