# Go stubs for aegis-probe:  buf generate
# (Java stubs are generated by Maven, module aegis-proto)
version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go
    out: aegis-probe/gen
    opt: paths=source_relative
  - remote: buf.build/grpc/go
    out: aegis-probe/gen
    opt: paths=source_relative
